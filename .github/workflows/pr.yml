name: PR checks

# Every pull request against main is built before merge: the production
# build, an internal link check over dist/, a guard against the pre-v2
# module path, and an advisory compile check of the Go snippets.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.4"
  GO_VERSION: "1.26.x"
  BELUGA_AI_REPO: "lookatitude/beluga-ai"

jobs:
  build:
    name: Build and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Reject pre-v2 module imports
        run: |
          # The framework module is github.com/lookatitude/beluga-ai/v2. The
          # bare path resolves to v1.10.0, which has none of the documented
          # packages. GitHub web URLs (https://github.com/...) are allowed.
          if grep -rnP '(?<!https://)github\.com/lookatitude/beluga-ai/(?!v2\b)[a-z]' src .claude; then
            echo "::error::Use github.com/lookatitude/beluga-ai/v2/... in imports and go get lines."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Check internal links
        run: python3 -I scripts/check-links.py dist

  snippets:
    name: Go snippets (advisory)
    runs-on: ubuntu-latest
    # Partial snippets that omit app-specific helpers fail to compile on
    # purpose, so this job reports instead of blocking. Read the summary for
    # snippets that call framework APIs that don't exist.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve latest framework release
        id: fw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$BELUGA_AI_REPO" --json tagName --jq .tagName)
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected framework tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BELUGA_AI_REPO }}
          ref: ${{ steps.fw.outputs.tag }}
          path: .framework
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Compile snippets against the framework
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          # Advisory: report failures as a warning and in the job summary, but
          # never fail the job (partial snippets are expected to not compile).
          set +e
          scripts/snippets/check.sh .framework snippet-report | tee snippet-summary.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Some Go snippets do not compile (advisory; see the job summary and snippet-report artifact)"
          fi
          {
            echo "## Go snippet check (framework ${{ steps.fw.outputs.tag }})"
            echo '```'
            tail -n 200 snippet-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snippet-report
          path: snippet-report/
          if-no-files-found: ignore
