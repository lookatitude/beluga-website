name: Build and Deploy

# Triggers:
# - push to main (content/config edits in this repo)
# - repository_dispatch from beluga-ai releases (new godoc / reports)
# - manual
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [framework-release]
  workflow_dispatch:
    inputs:
      framework_tag:
        description: "beluga-ai release tag (blank = latest)"
        required: false
        default: ""

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.4"
  BELUGA_AI_REPO: "lookatitude/beluga-ai"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      # Event values reach the shell only through env, never through
      # ${{ }} interpolation inside run:, and the tag is validated before use.
      - name: Resolve docs bundle tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.framework_tag }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo "$BELUGA_AI_REPO" --json tagName --jq .tagName)
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid framework tag: '$TAG' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using docs bundle from ${BELUGA_AI_REPO}@${TAG}"

      - name: Fetch docs bundle from beluga-ai release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          # A release-triggered build without its bundle is a real failure;
          # push and manual builds keep the soft-fail behaviour.
          DOCS_BUNDLE_REQUIRED: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
        run: scripts/fetch-docs-bundle.sh "$TAG"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
